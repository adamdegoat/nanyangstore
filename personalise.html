function LW(D,t,c){let x=0;for(const ch of t){const w=(D.wem[ch]??1)*c*D.wf;x+=w+c*D.ag;}return x-c*D.ag;}

function plaqueRosette(D,copy){
 const CAP=D.caps,LO=D.lo,TE=D.field;
 const title=copy.title||" ",sub=copy.subtitle||" ",caps=copy.caption,fl=copy.foot_l,fr=copy.foot_r,ded=copy.dedication;
 const tw=Math.max(LW(D,title,CAP.title),LW(D,sub,CAP.sub),LW(D,fl,CAP.foot)+LW(D,fr,CAP.foot)+6,...caps.map(t=>LW(D,t,CAP.caption)),ded?LW(D,ded,CAP.ded):0);

 const lines=[[title,CAP.title],[sub,CAP.sub],...caps.map(t=>[t,CAP.caption])];let li=0,y=ph-LO.MARGIN;
 for(const[k,h]of plan){
  if(k=="gap")y-=h;
  else if(k=="dent"){const dx=RI+RR+1,e=pw-(RI+RR+1);let x=dx;while(x+0.8<e){P.push(rc(x,y-h+0.2,0.8,h-0.2,IV));x+=1.5;}y-=h;}
  else if(k=="div"){const yd=y-0.25;P.push(rc(pw*0.22,yd-0.25,pw*0.56,0.5,IV));for(const cx of[pw*0.32,pw*0.68])P.push(`<path d="M ${cx} ${yd-1.35} L ${cx+0.6} ${yd-0.75} L ${cx} ${yd-0.15} L ${cx-0.6} ${yd-0.75} Z" fill="${IV}"/>`);y-=h;}

 }
 return svgWrap(pw,ph,P.join(""));
}
function plaqueBands(D,copy){
 const dm=D.dims,FIELD=D.field,w=dm.w,h=dm.h,B=dm.BORDER,PAD=dm.PAD,GAP=dm.GAP;
 const title=copy.title, subs=copy.subs, caps=copy.caption, foots=copy.foot;
 const head_h=title[1]+2*1.2, foot_h=foots.reduce((s,[,c])=>s+c,0)+GAP*(foots.length-1)+2*1.1;
 const head0=h-B-head_h, foot1=B+foot_h, P=[];
 P.push(rc(0,0,w,h,FIELD));P.push(rc(B,head0,w-2*B,h-B-head0,IV));P.push(rc(B,B,w-2*B,foot1-B,IV));

 let fz=foot1-1.1;for(const[t,c]of foots){fz-=c;P.push(txt(D,t,c,(w-LW(D,t,c))/2,fz,FIELD));fz-=GAP;}
 const body=[...subs.map(([t,c])=>[t,c,false]),["",GAP*1.6,true],...caps.map(([t,c])=>[t,c,false])];

 for(const[t,c,brk]of body){top-=c;if(brk){P.push(rc(B+PAD,top+c/2-0.22,w-2*(B+PAD),0.44,IV));}else{P.push(txt(D,t,c,(w-LW(D,t,c))/2,top,IV));}top-=GAP;}

function nameBoard(D,lang,val){
 const nb=D.nameboard,W=nb.W,H=nb.H,PAD=W*0.10;
 document.getElementById("nmcap").textContent = lang=="cn" ? "Name board — Chinese reads right to left, the prewar way" : "Name board — English";
 if(lang=="cn"){
  const chars=[...val].filter(c=>c.trim()),n=Math.max(1,chars.length);
  const fs=Math.min(H*0.92,(W-2*PAD)/n),step=(W-2*PAD)/n;let inner="";
  chars.forEach((ch,i)=>{const cx=W-PAD-step/2-i*step;inner+=`<text x="${cx}" y="${H*0.80}" font-family="'Ma Shan Zheng',serif" font-size="${fs}" fill="${nb.chars}" text-anchor="middle">${ch}</text>`;});
  document.getElementById("nameboard").innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="max-width:250px"><rect width="${W}" height="${H}" fill="${nb.board}"/>${inner}</svg>`;
 } else {
  const t=(val||" ").toUpperCase(),availW=W-2*PAD,w1=LW(D,t,1)||1,cap=Math.min(H*0.80,availW/w1),tw=LW(D,t,cap);

 }
}
